<!doctype html>
<html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111111"><title>DJ Requests</title>
<style>
:root{color-scheme:dark;--bg:#101010;--panel:#191919;--line:#303030;--muted:#a1a1aa;--accent:#a3e635;--danger:#f87171}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f8fafc;font:15px/1.45 Inter,system-ui,-apple-system,sans-serif}.wrap{max-width:560px;margin:auto;padding:24px 18px 60px}.brand{display:flex;align-items:center;justify-content:space-between;padding:28px 0 34px}.brand h1{font-size:23px;letter-spacing:-.7px;margin:0}.brand p{margin:5px 0 0;color:var(--muted);font-size:13px}.mark{width:42px;height:42px;border-radius:14px;background:var(--accent);color:#111;display:grid;place-items:center;font-size:22px;font-weight:900}.field{width:100%;background:#171717;border:1px solid var(--line);border-radius:12px;padding:14px 15px;color:white;font:inherit;outline:none;margin-bottom:10px}.field:focus{border-color:var(--accent)}.field::placeholder{color:#737373}.hint{color:var(--muted);font-size:12px;margin:5px 2px 15px}.results{display:grid;gap:8px}.track{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:12px}.track-info{flex:1;min-width:0}.track-name{font-weight:700;overflow-wrap:anywhere}.track-artist{color:var(--muted);font-size:13px;margin-top:2px}.btn{border:0;border-radius:9px;padding:10px 13px;font:inherit;font-weight:700;cursor:pointer}.btn:disabled{opacity:.5;cursor:wait}.primary{background:var(--accent);color:#111}.secondary{background:#242424;color:#eee;border:1px solid #393939}.remove{background:transparent;border:1px solid #553030;color:var(--danger)}.msg{padding:13px 14px;border-radius:11px;background:#202020;color:#ddd;margin:12px 0;font-size:13px}.success{border:1px solid #45651e;background:#1a2411}.error{border:1px solid #673333;background:#281616;color:#fecaca}.muted{color:var(--muted)}.foot{display:flex;justify-content:center;margin-top:35px}.link{border:0;background:none;color:#737373;font-size:12px;cursor:pointer}.hidden{display:none!important}.admin-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:20px 0}.admin-head h2{font-size:19px;margin:0}.filters{display:flex;gap:7px;margin:16px 0}.filter{background:#202020;color:#ddd;border:1px solid var(--line);padding:8px 12px;border-radius:9px;cursor:pointer}.filter.active{background:var(--accent);color:#111;border-color:var(--accent);font-weight:800}.request{padding:14px 0;border-bottom:1px solid #292929;display:flex;align-items:center;gap:12px}.request-info{flex:1;min-width:0}.request-title{font-weight:700;overflow-wrap:anywhere}.request-sub{font-size:13px;color:var(--muted);overflow-wrap:anywhere}.request-actions{display:flex;gap:6px;flex-shrink:0}.request-actions .btn{font-size:12px;padding:7px 9px}.status{font-size:11px;color:var(--muted);margin-top:3px}.login{max-width:360px;margin:20vh auto 0;text-align:center}.login h2{margin-bottom:20px}.empty{padding:36px 10px;text-align:center;color:var(--muted)}a{color:var(--accent)}@media(max-width:420px){.request{align-items:flex-start}.request-actions{flex-direction:column}.brand{padding-top:14px}}
</style></head><body><main class="wrap" id="app">
<header class="brand"><div><h1>DJ REQUESTS</h1><p>Escolhe a música. Nós tratamos do resto.</p></div><div class="mark">♫</div></header>
<section id="guest"><input id="name" class="field" maxlength="80" placeholder="O teu nome (opcional)" autocomplete="name"><input id="search" class="field" placeholder="Pesquisar música ou artista…" autocomplete="off"><div id="hint" class="hint">Escreve pelo menos 2 caracteres para pesquisar.</div><div id="results" class="results"></div><div id="notice" aria-live="polite"></div><div class="foot"><button class="link" id="open-login">Painel DJ</button></div></section>
<section id="login" class="hidden"><div class="login"><h2>Painel DJ</h2><form id="login-form"><input id="password" class="field" type="password" placeholder="Palavra-passe" autocomplete="current-password" required><button class="btn primary" style="width:100%">Entrar</button></form><div id="login-error"></div><div class="foot"><button class="link" id="back-guest">Voltar</button></div></div></section>
<section id="admin" class="hidden"><div class="admin-head"><div><h2>Pedidos</h2><div class="muted" id="count">A carregar…</div></div><div style="display:flex;gap:7px"><button class="btn secondary" id="sync">Sincronizar</button><button class="btn secondary" id="refresh">↻</button></div></div><div id="spotify-status" class="msg">A verificar Spotify…</div><div class="filters"><button class="filter active" data-filter="all">Todos</button><button class="filter" data-filter="pending">Por tocar</button><button class="filter" data-filter="played">Tocados</button></div><div id="requests"></div><div class="foot" style="gap:18px"><button class="link" id="clear">Limpar pedidos</button><button class="link" id="logout">Terminar sessão</button><button class="link" id="to-guest">Vista pública</button></div></section>
</main><script>
const $=id=>document.getElementById(id);let timer=null,poll=null,filter='all',requests=[],busy=false;const idempotencyKeys=new Map();
function show(which){['guest','login','admin'].forEach(x=>$(x).classList.toggle('hidden',x!==which));if(poll)clearInterval(poll);if(which==='admin'){loadRequests();spotifyStatus();poll=setInterval(loadRequests,4000)}if(which==='guest')history.replaceState(null,'','/');}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function api(url,opts={}){const r=await fetch(url,{credentials:'same-origin',...opts,headers:{...(opts.body?{'Content-Type':'application/json'}:{}),...(opts.headers||{})}});let d={};try{d=await r.json()}catch{}if(!r.ok){const e=new Error(d.error||`http_${r.status}`);e.status=r.status;throw e}return d}
$('open-login').onclick=()=>show('login');$('back-guest').onclick=()=>show('guest');$('to-guest').onclick=()=>show('guest');
$('login-form').onsubmit=async e=>{e.preventDefault();$('login-error').innerHTML='';try{await api('/api/admin-login',{method:'POST',body:JSON.stringify({password:$('password').value})});$('password').value='';show('admin')}catch{$('login-error').innerHTML='<div class="msg error">Não foi possível iniciar sessão.</div>'}};
let searchTimer=null; $('search').addEventListener('input',()=>{clearTimeout(searchTimer);const q=$('search').value.trim();$('results').innerHTML='';$('notice').innerHTML='';if(q.length<2){$('hint').textContent='Escreve pelo menos 2 caracteres para pesquisar.';return}$('hint').textContent='A pesquisar…';searchTimer=setTimeout(()=>search(q),350)});
async function search(q){try{const list=await api('/api/spotify?q='+encodeURIComponent(q));$('hint').textContent=list.length?'Escolhe uma música para enviar o pedido.':'Não foram encontradas músicas.';$('results').innerHTML=list.map((t,i)=>`<div class="track"><div class="track-info"><div class="track-name">${esc(t.name)}</div><div class="track-artist">${esc(t.artist)}</div></div><button class="btn primary" data-track="${i}">Pedir</button></div>`).join('');[...$('results').querySelectorAll('[data-track]')].forEach((b,i)=>b.onclick=()=>requestTrack(list[i],b))}catch{$('hint').textContent='Erro na pesquisa. Tenta novamente.'}}
async function requestTrack(track,button){if(busy)return;busy=true;button.disabled=true;try{const key=idempotencyKeys.get(track.id)||crypto.randomUUID();idempotencyKeys.set(track.id,key);const r=await api('/api/requests',{method:'POST',headers:{'Idempotency-Key':key},body:JSON.stringify({track,requester:$('name').value.trim()||'Anónimo'})});idempotencyKeys.delete(track.id);$('notice').innerHTML=`<div class="msg success">Pedido enviado: <strong>${esc(track.name)}</strong>${r.spotify_sync_status==='synced'?' · adicionado à playlist.':' · recebido; a sincronização será repetida se necessário.'}</div>`; $('search').value='';$('results').innerHTML='';$('hint').textContent='Escreve para pedir outra música.'}catch{$('notice').innerHTML='<div class="msg error">Não foi possível enviar o pedido. Tenta novamente.</div>'}finally{busy=false;button.disabled=false}}
async function loadRequests(){try{requests=await api('/api/requests');$('count').textContent=`${requests.filter(r=>!r.played).length} por tocar · ${requests.length} pedidos`;renderRequests()}catch{$('count').textContent='Erro ao carregar pedidos.'}}
function renderRequests(){const rows=requests.filter(r=>filter==='all'||(filter==='pending'&&!r.played)||(filter==='played'&&r.played));if(!rows.length){$('requests').innerHTML='<div class="empty">Ainda não há pedidos nesta lista.</div>';return}$('requests').innerHTML=rows.map(r=>`<div class="request"><div class="request-info"><div class="request-title">${esc(r.track?.name)}</div><div class="request-sub">${esc(r.track?.artist)} · ${esc(r.requester)} · ${esc(r.time)}</div><div class="status">${r.played?'Tocada': 'Por tocar'} · Playlist: ${r.spotify_sync_status==='synced'?'sincronizada':r.spotify_sync_status==='failed'?'erro — será necessário repetir':'a sincronizar'}</div></div><div class="request-actions">${!r.played?`<button class="btn primary" data-play="${esc(r.id)}">Tocou</button>`:''}<button class="btn remove" data-remove="${esc(r.id)}">Remover</button></div></div>`).join('');$('requests').querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>mutate('/api/requests?id='+encodeURIComponent(b.dataset.play),'PATCH',{played:true}));$('requests').querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>removeRequest(b.dataset.remove))}
async function mutate(url,method,body){try{await api(url,{method,body:body?JSON.stringify(body):undefined});await loadRequests()}catch(e){alert('Não foi possível atualizar o pedido. Verifica a sessão e tenta novamente.');if(e.status===401)show('login')}}
async function removeRequest(id){if(confirm('Remover este pedido? A música fica na playlist Spotify.'))await mutate('/api/requests?id='+encodeURIComponent(id),'DELETE')}
$('clear').onclick=async()=>{if(confirm('Limpar todos os pedidos? As músicas ficam na playlist Spotify.'))await mutate('/api/requests?id=all','DELETE')};$('refresh').onclick=loadRequests;$('sync').onclick=async()=>{try{const d=await api('/api/sync',{method:'POST',body:'{}'});alert(`Sincronização terminada. Sucesso: ${d.synced}; falhas: ${d.failed}.`);loadRequests()}catch{alert('Falha na sincronização. Verifica a ligação Spotify.')}};$('logout').onclick=async()=>{await api('/api/admin-logout',{method:'POST'}).catch(()=>{});show('guest')};document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));renderRequests()});
async function spotifyStatus(){try{const s=await api('/api/spotify-auth?action=status');$('spotify-status').innerHTML=s.connected?`Spotify ligado · <a href="${esc(s.playlistUrl)}" target="_blank" rel="noopener">Abrir playlist</a> · <a href="/api/spotify-auth?action=login">Ligar novamente</a>`:`Spotify ainda não ligado. <a href="/api/spotify-auth?action=login">Autorizar Spotify</a>`}catch{$('spotify-status').innerHTML='Não foi possível verificar o Spotify. <a href="/api/spotify-auth?action=login">Tentar ligar</a>'}}
if(location.hash==='#dj'||new URLSearchParams(location.search).get('spotify')==='connected')show('admin');
</script></body></html>
